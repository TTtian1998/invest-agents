[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhiku"
version = "0.2.0"
description = "每日选股打分、回测验证、AI 审核与触发线纪律的个人投研工具"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "invest-agents contributors" }]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6",
  "pandas>=2.2",
  "akshare>=1.19",
  "yfinance>=1.7",
  "tzdata",
]

[project.optional-dependencies]
stats = ["quantstats>=0.0.86"]
debate = ["tradingagents @ git+https://github.com/TauricResearch/TradingAgents@v0.7.0"]
qlib = ["pyqlib>=0.9", "lightgbm>=4"]
backtest = ["vectorbt>=0.27"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
legacy-ui = ["streamlit>=1.38"]
masters = ["openai>=1.40"]
cursor = ["cursor-sdk"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "scipy", "httpx>=0.27"]
full = ["fastapi>=0.115", "uvicorn>=0.30", "streamlit>=1.38", "vectorbt>=0.27", "quantstats>=0.0.86", "openai>=1.40"]

[project.scripts]
zk = "zhiku.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/zhiku"]

# In-package static/templates/YAML are included once by packages above.
[tool.hatch.build.targets.wheel.force-include]
"config/x_accounts.example.yaml" = "zhiku/news/x_accounts.example.yaml"

[tool.pytest.ini_options]
addopts = "-m \"not network\""
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "network: 需要访问 akshare / yfinance 等在线行情的测试",
  "qlib: 需要安装 pyqlib 的测试",
  "heavy: 可选重依赖（vectorbt / streamlit / openai）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
allow_untyped_defs = true
warn_unused_ignores = false
pretty = true

[tool.coverage.run]
source = ["zhiku"]
branch = true
