# X 财经大V 关注名单（公开账号示例）。
# 复制到 ZHIKU_KB/config/x_accounts.yaml 后由 live 采集使用；仓库内这份不含任何私有名单。
# 分类：
#   newswire     快讯
#   macro_fed    美联储/宏观
#   institutional 机构大佬（有利益关系，按三级信源辩证审查）
#   flow_trader  交易/资金流
#   contrarian   反向参考
#
# known_holdings 只填公开披露的代码（13F/基金持仓网页），不要写数量。
# 示例名单留空，避免把真实持仓明细写进仓库。

