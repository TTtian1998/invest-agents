<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="智库：可追溯的个人投资研究工作台。" />
    <title>智库 · 投研工作台</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/workspace.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link">跳到主要内容</a>
    <aside class="sidebar" id="sidebar" aria-label="工作区导航">
      <a class="brand" href="#overview"
        ><span class="brand-mark" aria-hidden="true">知</span
        ><span>智库<span class="brand-sub">投资研究工作台</span></span></a
      >
      <div class="workspace-name">
        <span class="workspace-avatar">研</span
        ><span>个人研究空间<small>证据先行，纪律为本</small></span
        ><span class="workspace-lock" aria-hidden="true">⌁</span>
      </div>
      <p class="nav-label">工作空间</p>
      <nav id="navigation">
        <a class="nav-link active" href="#overview" data-page="overview"
          ><span data-icon="overview"></span>今日概览</a
        >
        <a class="nav-link" href="#universe" data-page="universe"
          ><span data-icon="universe"></span>候选与观察<span
            class="nav-count"
            id="nav-count"
            >—</span
          ></a
        >
        <a class="nav-link" href="#evidence" data-page="evidence"
          ><span data-icon="evidence"></span>消息与证据</a
        >
        <a class="nav-link" href="#validation" data-page="validation"
          ><span data-icon="shield"></span>研究验证</a
        >
      </nav>
      <div class="sidebar-note">
        <span data-icon="lock"></span><strong>只读研究环境</strong>
        <p>展示已生成的研究快照。<br />不会交易、训练或自动发布。</p>
      </div>
      <div class="sidebar-footer">
        <span class="avatar">ZK</span>
        <div>zhiku<small>独立研究 · 审慎决策</small></div>
        <span class="version">v0.2</span>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            id="menu-toggle"
            aria-label="展开导航"
            aria-expanded="false"
          >
            <span data-icon="menu"></span></button
          ><span class="breadcrumb-home">工作空间</span
          ><span class="crumb-slash">/</span
          ><strong id="page-crumb">今日概览</strong>
        </div>
        <div class="topbar-right">
          <span class="mode-badge" id="mode-badge">读取环境</span
          ><span class="topbar-divider"></span
          ><span class="readonly"><span data-icon="lock"></span>只读</span>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="page-heading">
          <div>
            <div class="heading-eyebrow" id="heading-eyebrow">研究工作台</div>
            <h1 id="page-title">今日概览</h1>
            <p id="page-description">从研究线索，到可以复核的判断。</p>
          </div>
          <div class="heading-actions">
            <label class="snapshot-control"
              ><span data-icon="calendar"></span
              ><select id="snapshot-select" aria-label="选择研究快照">
                <option value="latest">最新快照</option>
              </select></label
            ><button class="button secondary" id="refresh">
              <span data-icon="refresh"></span><span>刷新</span></button
            ><a class="button primary" id="export" href="/api/export"
              ><span data-icon="download"></span><span>导出快照</span></a
            >
          </div>
        </div>
        <div id="trust-banner" class="trust-banner skeleton" aria-live="polite">
          <span>正在读取研究快照与来源状态…</span>
        </div>
        <div id="content" aria-busy="true">
          <div class="loading-layout" aria-label="正在加载">
            <div class="skeleton loading-summary"></div>
            <div class="skeleton loading-panel"></div>
          </div>
        </div>
        <footer class="page-footer">
          <span>研究与提醒工具，不构成投资建议。研究分不等于收益或胜率。</span
          ><span id="footer-snapshot">数据来源待确认</span>
        </footer>
      </main>
    </div>
    <dialog id="symbol-dialog" aria-labelledby="symbol-title">
      <div id="symbol-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      >请启用 JavaScript
      查看研究工作台。此页面不会执行交易或调用外部模型。</noscript
    >
  </body>
</html>
