name: Workspace browser QA

on:
  push:
    branches: [main, "feat/**", "cursor/**"]
    paths:
      - "src/zhiku/app/**"
      - "src/zhiku/config.py"
      - "scripts/qa_workspace_browser.py"
      - "scripts/requirements-browser.txt"
      - "pyproject.toml"
      - ".github/workflows/workspace-browser.yml"
  pull_request:
    paths:
      - "src/zhiku/app/**"
      - "src/zhiku/config.py"
      - "scripts/qa_workspace_browser.py"
      - "scripts/requirements-browser.txt"
      - "pyproject.toml"
      - ".github/workflows/workspace-browser.yml"
  workflow_dispatch:

# This job needs no write token, account secrets, private KB, or public deployment.
permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            scripts/requirements-browser.txt
      - name: Install app and official Playwright
        run: |
          python -m pip install -e ".[ui]" -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Install Chinese screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise real localhost app in Chromium
        env:
          PYTHONPATH: src
        run: python scripts/qa_workspace_browser.py --output-dir browser-artifacts
      - name: Upload screenshots, traces and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-${{ github.sha }}
          path: browser-artifacts/
          if-no-files-found: error
          retention-days: 14
